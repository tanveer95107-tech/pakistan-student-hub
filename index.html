<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pakistan Student Hub</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7f6;
    color:#17201d;
}

header{
    background:linear-gradient(135deg,#006a4e,#00966c);
    color:white;
    padding:28px 18px;
    text-align:center;
}

header h1{
    font-size:28px;
    margin-bottom:7px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:18px;
}

.search{
    width:100%;
    padding:15px;
    border:1px solid #d8e1de;
    border-radius:15px;
    font-size:16px;
    margin-bottom:18px;
}

.section{
    background:white;
    padding:20px;
    border-radius:20px;
    margin-bottom:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.section h2{
    color:#006a4e;
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
}

.card{
    background:#fff;
    border:1px solid #e1e9e6;
    border-radius:16px;
    padding:18px;
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    border-color:#00966c;
}

.card.active{
    background:#e5f5ef;
    border-color:#006a4e;
}

.icon{
    font-size:27px;
    margin-bottom:9px;
}

.card h3{
    font-size:16px;
    margin-bottom:5px;
}

.card p{
    color:#6b7672;
    font-size:13px;
}

.hidden{
    display:none;
}

.books{
    display:grid;
    gap:12px;
}

.book{
    border:1px solid #e1e9e6;
    border-radius:15px;
    padding:17px;
}

.book h3{
    margin-bottom:6px;
}

.book p{
    color:#68736f;
    margin-bottom:12px;
}

.button{
    display:inline-block;
    border:0;
    border-radius:10px;
    padding:11px 16px;
    background:#006a4e;
    color:white;
    text-decoration:none;
    cursor:pointer;
}

.button.secondary{
    background:#e8f3ef;
    color:#006a4e;
}

.message{
    padding:15px;
    border-radius:12px;
    background:#fff4d6;
    margin-top:12px;
    line-height:1.5;
}

footer{
    text-align:center;
    padding:30px;
    color:#68736f;
    font-size:13px;
}
</style>
</head>

<body>

<header>
    <h1>🇵🇰 Pakistan Student Hub</h1>
    <p>Books • Subjects • Notes • Practice</p>
</header>

<div class="container">

<input
    id="search"
    class="search"
    type="search"
    placeholder="🔎 Search class, subject or book..."
    oninput="searchEverything()"
>

<div class="section">
    <h2>1️⃣ Select Board</h2>
    <div id="boards" class="grid"></div>
</div>

<div id="classSection" class="section hidden">
    <h2>2️⃣ Select Class</h2>
    <div id="classes" class="grid"></div>
</div>

<div id="mediumSection" class="section hidden">
    <h2>3️⃣ Select Medium</h2>
    <div id="mediums" class="grid"></div>
</div>

<div id="subjectSection" class="section hidden">
    <h2>4️⃣ Select Subject</h2>
    <div id="subjects" class="grid"></div>
</div>

<div id="bookSection" class="section hidden">
    <h2>5️⃣ Books</h2>
    <div id="books" class="books"></div>
</div>

<div id="searchResults" class="section hidden"></div>

</div>

<footer>
Pakistan Student Hub<br>
Educational resources organized for students
</footer>

<script>

/* =========================
   BOARDS
========================= */

    },
    {

    },
    {

        description:"Federal education resources",
        official:""
    },
    {
        id:"ajk",
        name:"AJK",
        icon:"🏔️",
        description:"Azad Jammu & Kashmir",
        official:""
    },
    {
        id:"gb",
        name:"Gilgit-Baltistan",
        icon:"🏔️",
        description:"Gilgit-Baltistan education",
        official:""
    }
];


/* =========================
   CLASSES
========================= */

const classes = [
    "ECCE / Katchi",
    "Class 1",
    "Class 2",
    "Class 3",
    "Class 4",
    "Class 5",
    "Class 6",
    "Class 7",
    "Class 8",
    "Class 9",
    "Class 10",
    "Class 11",
    "Class 12"
];


/* =========================
   MEDIUMS
========================= */

const mediums = [
    "English",
    "Urdu",
    "Sindhi"
];


/* =========================
   GENERAL SUBJECTS
========================= */

const subjects = [
    "English",
    "Urdu",
    "Mathematics",
    "Science",
    "Computer Science",
    "Islamiat",
    "Pakistan Studies",
    "Social Studies",
    "Physics",
    "Chemistry",
    "Biology",
    "Geography",
    "History",
    "Economics",
    "Civics"
];


/*
=========================================
 VERIFIED BOOK DATA

 Only books with a verified official URL
 should be placed here.

 The Sindh examples below use the official
 Sindh Textbook Board eBooks portal.
=========================================
*/

const books = [

    {
        board:"sindh",
        className:"Class 1",
        medium:"English",
        subject:"English",
        title:"English Book I",
        year:"2026",
        url:"https://portal.stbb.edu.pk/ebooks/class.php?id=1&medium=English"
    },

    {
        board:"sindh",
        className:"Class 1",
        medium:"English",
        subject:"Mathematics",
        title:"English Math I",
        year:"2026",
        url:"https://portal.stbb.edu.pk/ebooks/class.php?id=1&medium=English"
    },

    {
        board:"sindh",
        className:"Class 1",
        medium:"Urdu",
        subject:"Mathematics",
        title:"Urdu Riazi I",
        year:"2026",
        url:"https://portal.stbb.edu.pk/ebooks/class.php?id=1&medium=Urdu"
    },

    {
        board:"sindh",
        className:"Class 1",
        medium:"Urdu",
        subject:"Urdu",
        title:"Urdu Reader I",
        year:"2022-23",
        url:"https://portal.stbb.edu.pk/ebooks/class.php?id=1&medium=Urdu"
    },

    {
        board:"sindh",
        className:"Class 9",
        medium:"Sindhi",
        subject:"Biology",
        title:"Biology IX",
        year:"2020-21",
        url:"https://ebooks.stbb.edu.pk/sindhi/class-ix"
    },

    {
        board:"sindh",
        className:"Class 9",
        medium:"Sindhi",
        subject:"Computer Science",
        title:"Computer Science IX",
        year:"2020-21",
        url:"https://ebooks.stbb.edu.pk/sindhi/class-ix"
    },

    {
        board:"sindh",
        className:"Class 9",
        medium:"Sindhi",
        subject:"Chemistry",
        title:"Chemistry IX",
        year:"2022-23",
        url:"https://ebooks.stbb.edu.pk/sindhi/class-ix"
    },

    {
        board:"sindh",
        className:"Class 10",
        medium:"English",
        subject:"Biology",
        title:"English Biology X",
        year:"2021-22",
        url:"https://portal.stbb.edu.pk/ebooks/class.php?id=11&medium=English"
    },

    {
        board:"sindh",
        className:"Class 10",
        medium:"English",
        subject:"Chemistry",
        title:"English Chemistry X",
        year:"2022-23",
        url:"https://portal.stbb.edu.pk/ebooks/class.php?id=11&medium=English"
    },

    {
        board:"sindh",
        className:"Class 10",
        medium:"English",
        subject:"Computer Science",
        title:"English Computer Science X",
        year:"2025-26",
        url:"https://portal.stbb.edu.pk/ebooks/class.php?id=11&medium=English"
    },

    {
        board:"sindh",
        className:"Class 10",
        medium:"English",
        subject:"Mathematics",
        title:"English Math X",
        year:"2024-25",
        url:"https://portal.stbb.edu.pk/ebooks/class.php?id=11&medium=English"
    },

    {
        board:"sindh",
        className:"Class 10",
        medium:"English",
        subject:"Physics",
        title:"English Physics X",
        year:"2026",
        url:"https://portal.stbb.edu.pk/ebooks/class.php?id=11&medium=English"
    }

];


/* =========================
   APP STATE
========================= */

let selectedBoard = "";
let selectedClass = "";
let selectedMedium = "";
let selectedSubject = "";


/* =========================
   CREATE BOARDS
========================= */

function createBoards(){

    const box = document.getElementById("boards");

    boards.forEach(board => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="icon">${board.icon}</div>
            <h3>${board.name}</h3>
            <p>${board.description}</p>
        `;

        card.onclick = () => selectBoard(board);

        box.appendChild(card);
    });
}


/* =========================
   SELECT BOARD
========================= */

function selectBoard(board){

    selectedBoard = board.id;
    selectedClass = "";
    selectedMedium = "";
    selectedSubject = "";

    document.getElementById("classSection")
        .classList.remove("hidden");

    document.getElementById("mediumSection")
        .classList.add("hidden");

    document.getElementById("subjectSection")
        .classList.add("hidden");

    document.getElementById("bookSection")
        .classList.add("hidden");

    createClasses();

    window.scrollTo({
        top:document.getElementById("classSection").offsetTop - 10,
        behavior:"smooth"
    });
}


/* =========================
   CREATE CLASSES
========================= */

function createClasses(){

    const box = document.getElementById("classes");

    box.innerHTML = "";

    classes.forEach(item => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="icon">🎓</div>
            <h3>${item}</h3>
            <p>Open class</p>
        `;

        card.onclick = () => selectClass(item);

        box.appendChild(card);
    });
}


/* =========================
   SELECT CLASS
========================= */

function selectClass(className){

    selectedClass = className;

    document.getElementById("mediumSection")
        .classList.remove("hidden");

    createMediums();

    window.scrollTo({
        top:document.getElementById("mediumSection").offsetTop - 10,
        behavior:"smooth"
    });
}


/* =========================
   CREATE MEDIUMS
========================= */

function createMediums(){

    const box = document.getElementById("mediums");

    box.innerHTML = "";

    mediums.forEach(medium => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="icon">
                ${medium === "English" ? "🔵" :
                  medium === "Urdu" ? "🟢" : "🟡"}
            </div>

            <h3>${medium}</h3>
            <p>Choose medium</p>
        `;

        card.onclick = () => selectMedium(medium);

        box.appendChild(card);
    });
}


/* =========================
   SELECT MEDIUM
========================= */

function selectMedium(medium){

    selectedMedium = medium;

    document.getElementById("subjectSection")
        .classList.remove("hidden");

    createSubjects();

    window.scrollTo({
        top:document.getElementById("subjectSection").offsetTop - 10,
        behavior:"smooth"
    });
}


/* =========================
   CREATE SUBJECTS
========================= */

function createSubjects(){

    const box = document.getElementById("subjects");

    box.innerHTML = "";

    subjects.forEach(subject => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="icon">📖</div>
            <h3>${subject}</h3>
            <p>Open subject</p>
        `;

        card.onclick = () => selectSubject(subject);

        box.appendChild(card);
    });
}


/* =========================
   SELECT SUBJECT
========================= */

function selectSubject(subject){

    selectedSubject = subject;

    showBooks();
}


/* =========================
   SHOW BOOKS
========================= */

function showBooks(){

    const section =
        document.getElementById("bookSection");

    const box =
        document.getElementById("books");

    section.classList.remove("hidden");

    box.innerHTML = "";

    const matchingBooks = books.filter(book =>
        book.board === selectedBoard &&
        book.className === selectedClass &&
        book.medium === selectedMedium &&
        book.subject === selectedSubject
    );


    if(matchingBooks.length === 0){

        box.innerHTML = `
            <div class="message">

                📚 <strong>Book not added yet</strong><br><br>

                We do not have a verified book link for:

                <br><br>

                <strong>
                ${selectedBoard}
                →
                ${selectedClass}
                →
                ${selectedMedium}
                →
                ${selectedSubject}
                </strong>

                <br><br>

                We are not showing made-up content.
                The book will be added when its official
                source is verified.

            </div>
        `;

    }else{

        matchingBooks.forEach(book => {

            const div = document.createElement("div");

            div.className = "book";

            div.innerHTML = `
                <h3>📘 ${book.title}</h3>

                <p>
                    ${book.className}
                    • ${book.medium}
                    • Edition: ${book.year}
                </p>

                <a
                    class="button"
                    href="${book.url}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    📖 Open Official Book
                </a>
            `;

            box.appendChild(div);

        });

    }


    section.scrollIntoView({
        behavior:"smooth"
    });
}


/* =========================
   SEARCH
========================= */

function searchEverything(){

    const query =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const results =
        document.getElementById("searchResults");

    if(!query){

        results.classList.add("hidden");

        return;
    }

    const foundBooks = books.filter(book =>
        book.title.toLowerCase().includes(query) ||
        book.subject.toLowerCase().includes(query) ||
        book.className.toLowerCase().includes(query) ||
        book.medium.toLowerCase().includes(query) ||
        book.board.toLowerCase().includes(query)
    );


    results.classList.remove("hidden");

    if(foundBooks.length === 0){

        results.innerHTML = `
            <h2>🔎 Search</h2>

            <div class="message">
                No verified book found for
                <strong>${query}</strong>.
                Try searching another class,
                subject or book name.
            </div>
        `;

        return;
    }


    let html = `<h2>🔎 Search Results</h2>`;

    foundBooks.forEach(book => {

        html += `
            <div class="book">

                <h3>📘 ${book.title}</h3>

                <p>
                    ${book.board}
                    • ${book.className}
                    • ${book.medium}
                    • ${book.subject}
                    • ${book.year}
                </p>

                <a
                    class="button"
                    href="${book.url}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    📖 Open Official Book
                </a>

            </div>
        `;

    });

    results.innerHTML = html;
}


/* =========================
   START APP
========================= */

createBoards();

</script>

</body>
</html>
